"use strict";
// ===================== GRAFIIKKA: 800x320 pikselipuskuri, kaksi näkymää =====================

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const img = ctx.createImageData(W, H);

const PAL = ['000000','ffffff','68372b','70a4b2','6f3d86','588d43','352879','b8c76f',

let clipX0 = 0, clipY0 = 0, clipX1 = W-1, clipY1 = H-1;
function setClip(x0, y0, x1, y1) { clipX0 = x0; clipY0 = y0; clipX1 = x1; clipY1 = y1; }
function fullClip() { setClip(0, 0, W-1, H-1); }
function pset(x, y, c) {

function fillRect(x, y, w, h, c) {
  const x0 = Math.max(clipX0, Math.round(x)), y0 = Math.max(clipY0, Math.round(y));
  const x1 = Math.min(clipX1, Math.round(x + w - 1)), y1 = Math.min(clipY1, Math.round(y + h - 1));

function hline(x0, x1, y, c) {
  y = Math.round(y); if (y < clipY0 || y > clipY1 || !isFinite(x0) || !isFinite(x1)) return;

  for (let x = x0; x <= x1; x++) buf[o+x] = col;

}

  const xa = clipX0 - 0.49, ya = clipY0 - 0.49, xb = clipX1 + 0.49, yb = clipY1 + 0.49;
  let c0 = outcode(x0, y0, xa, ya, xb, yb), c1 = outcode(x1, y1, xa, ya, xb, yb);
  for (let n = 0; n < 8; n++) {
    if (!(c0 | c1)) break;

    if (co & 8) { x = x0 + (x1-x0)*(yb-y0)/(y1-y0); y = yb; }

    else { x1 = x; y1 = y; c1 = outcode(x1, y1, xa, ya, xb, yb); }
  }
  if (c0 | c1) return;
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const col = PAL32[c];

    if (x0 === x1 && y0 === y1) break;

  if (yTop > yBot || cx + r < clipX0 || cx - r > clipX1) return;

  for (let y = yTop; y <= yBot; y++) {
    const dy = y - cy, w = Math.sqrt(Math.max(0, r*r - dy*dy));
    const l = cx - w, rr = cx + w;
    if (fill >= 0) hline(l, rr, y, fill);

      else { line(pl, py, l, y, c); line(pr, py, rr, y, c); }

    const a = i / seg * Math.PI * 2, x = cx + Math.cos(a)*rx, y = cy + Math.sin(a)*ry;
    line(px, py, x, y, c); px = x; py = y;

// Kupera monikulmio täytettynä (piilopintojen poistoon)
function fillPoly(pts, c) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { if (!(Math.abs(p[0]) < 1e5 && Math.abs(p[1]) < 1e5)) return; if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]; }

  const n = pts.length;
  for (let y = y0; y <= y1; y++) {
    const sy = y + 0.5; let xa = Infinity, xb = -Infinity;
    for (let i = 0; i < n; i++) {
      const a = pts[i], b = pts[(i+1) % n];
      if ((a[1] <= sy && b[1] > sy) || (b[1] <= sy && a[1] > sy)) {
        const x = a[0] + (sy - a[1]) * (b[0]-a[0]) / (b[1]-a[1]);
        if (x < xa) xa = x; if (x > xb) xb = x;
      }
    }
    if (xa <= xb) hline(xa, xb, y, c);
  }

function glyphIndex(ch) {
  const u = ch.toUpperCase();
  if (u === 'Ä') return 64; if (u === 'Ö') return 65; if (u === 'Å') return 66;
  const k = u.charCodeAt(0);
  if (k >= 32 && k < 96) return k - 32;

  s = String(s);
  for (let i = 0; i < s.length; i++) {
    const g = glyphIndex(s[i]) * 8;
    for (let row = 0; row < 8; row++) {
      const b = FONT[g + row]; if (!b) continue;
      for (let col = 0; col < 8; col++) if (b & (128 >> col)) {

// ===================== MATEMATIIKKA =====================

const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

function oriFromForward(f, upHint = [0,1,0]) {

  r = norm(r);
  return { r, u: cross(f, r), f };
}

// ===================== VEKTORIMALLIT: koostetut konveksit osat =====================
function buildPart(verts, opts = {}) {

    planes.push({ n: nn, d });

  const faces = planes.map(p => {
    const idx = []; verts.forEach((v, i) => { if (onPlane(p, v)) idx.push(i); });
    let cen = [0,0,0]; for (const i of idx) cen = add(cen, verts[i]); cen = scl(cen, 1/idx.length);
    const e1 = norm(sub(verts[idx[0]], cen)), e2 = cross(p.n, e1);

    faces.forEach((f, idx) => { const q = dot(f.n, norm(d.dir)); if (q > bd) { bd = q; best = idx; } });

  textC(190, 'SALAMA  ' + wins[0] + ' - ' + wins[1] + '  KORPPI', WHITE);
  const cl = [['PELAAJA 1 (VASEN)', CYAN, ['W S   NYÖKKÄYS', 'A D   KALLISTUS', 'Q E   SIVUKÄÄNTÖ', 'R F   KAASU / JARRU', 'VÄLILYÖNTI  LASER', 'X  OHJUS    C  SOIHDUT']],
              ['PELAAJA 2 (OIKEA)', YELLOW, ['NUOLET  NYÖKKÄYS / KALLISTUS', ',  .    SIVUKÄÄNTÖ', 'P  Ö    KAASU / JARRU', 'ENTER   LASER', 'OIK. SHIFT  OHJUS', 'Ä  SOIHDUT  (TAI NUMPAD)']]];
  cl.forEach(([h, c, ls], k) => {
    const x = k === 0 ? 30 : 450;
    text(x, 206, h, c); ls.forEach((l, j) => text(x, 218 + j * 10, l, LGREY));
  });
  textC(286, 'VOITTAJA TELAKOITUU ASEMALLE JA NOUTAA PALKINNON', LGREEN);
  textC(302, 'VÄLILYÖNTI TAI ENTER = ALOITA', (titleT * 3 | 0) % 2 ? WHITE : LGREY);
  rect(0, 0, W, H, LBLUE);
}
function drawTunnel(t, x0, label) {
  setClip(x0, 0, x0 + VW - 1, H - 1); fillRect(x0, 0, VW, H, BLACK);
  const cols = [BLUE, LBLUE, CYAN, WHITE], cx = x0 + VW/2;
  for (let k = 0; k < 14; k++) {
    const s = Math.pow(((t * 0.9 + k / 14) % 1), 2.2), w = s * 220, h = s * 170;
    rect(cx - w, 160 - h, w * 2, h * 2, cols[k % 4]);
  }
  textC(150, label, YELLOW, 2, x0, VW);
  rect(x0, 0, VW, H, LBLUE); fullClip();
}
function drawPrize() {
  fullClip(); fillRect(0, 0, W, H, BLACK);
  Object.assign(CAM, { pos: [0,0,0], r: [1,0,0], u: [0,1,0], f: [0,0,1], cx: 400, cy: 150, F: 300, hw: 400, hh: 160 });
  drawSkyPoints(SKY.stars);
  const tr = { model: MODELS.trophy, pos: [0, -14, 260], ...newOri() };
  rotYaw(tr, modeT * 1.1); rotPitch(tr, 0.2);
  setClip(250, 60, 550, 250); drawModel(tr, YELLOW); fullClip();
  // välkkyvät tähdet pokaalin ympärillä
  for (let k = 0; k < 10; k++) { const a = modeT * 0.8 + k * 0.63, r = 120 + Math.sin(modeT * 3 + k) * 10; pset(400 + Math.cos(a) * r, 150 + Math.sin(a) * r * 0.6, k % 2 ? YELLOW : WHITE); }
  const d = SHIPDEF[prize.id];
  textC(10, 'PALKINTOSEREMONIA', YELLOW, 3);
  textC(42, 'VOITTAJA: PELAAJA ' + (prize.id + 1) + ' - ' + d.name, d.col, 1);
  const lines = [['PERUSPALKKIO', prize.base], ['RUNKO EHJÄNÄ', prize.hullB], ['SÄÄSTETYT OHJUKSET', prize.misB], ['SÄÄSTETYT SOIHDUT', prize.flareB]];
  const shown = Math.min(lines.length, Math.floor(modeT / 0.5));
  lines.slice(0, shown).forEach(([n, v], k) => { text(40, 90 + k * 14, n, LGREY); textR(240, 90 + k * 14, v + ' CR', WHITE); });
  if (modeT > 2.4) { hline(40, 240, 150, LBLUE); text(40, 156, 'YHTEENSÄ', YELLOW); textR(240, 156, prize.total + ' CR', YELLOW); }
  text(570, 90, 'TILANNE', GREY);
  text(570, 106, 'SALAMA', CYAN); textR(770, 106, wins[0] + ' VOITTOA', WHITE); textR(770, 118, totals[0] + ' CR', LGREY);
  text(570, 136, 'KORPPI', YELLOW); textR(770, 136, wins[1] + ' VOITTOA', WHITE); textR(770, 148, totals[1] + ' CR', LGREY);
  if (modeT > 3) textC(290, 'VÄLILYÖNTI / ENTER = UUSI KAKSINTAISTELU   ESC = ALKURUUTU', (modeT * 3 | 0) % 2 ? WHITE : LGREY);
  rect(0, 0, W, H, YELLOW);
}
// ===================== SYÖTE JA SILMUKKA =====================
window.addEventListener('keydown', ev => {
  initAudio();
  const c = ev.code;
  if (!ev.ctrlKey && !ev.metaKey && !ev.altKey && !/^F([1-7]|1[0-2])$/.test(c)) ev.preventDefault();
  keys[c] = true;
  if (ev.repeat) return;
  try { onKey(c); } catch (err) { console.error(err); }
});
window.addEventListener('keyup', ev => { keys[ev.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function goSelect() { mode = 'select'; modeT = 0; sel[0].ready = sel[1].ready = false; players = []; }
function onKey(c) {
  if (c === 'Digit9' || c === 'F8') { soundOn = !soundOn; return; }
  if (c === 'Digit0' || c === 'F9') {
    const fr = document.getElementById('frame');
    if (document.fullscreenElement) document.exitFullscreen(); else if (fr.requestFullscreen) fr.requestFullscreen();
    return;
  }
  if (mode === 'title') { if (c === 'Space' || c === 'Enter' || c === 'NumpadEnter') { goSelect(); SFX.jingle(); } return; }
  if (mode === 'select') {
    if (c === 'Escape') { mode = 'title'; return; }
    const map = [{ up: 'KeyW', dn: 'KeyS', ok: 'Space', ready: 'KeyX', inv: 'KeyQ' },
                 { up: 'ArrowUp', dn: 'ArrowDown', ok: 'Enter', ready: 'ShiftRight', inv: 'Comma' }];
    map.forEach((m, i) => {
      const s = sel[i], pan = i ? 0.6 : -0.6;
      if (c === m.ready || (i === 1 && c === 'NumpadEnter')) { s.ready = !s.ready; SFX.beep(pan); return; }
      if (s.ready) return;
      if (c === m.up) { s.cur = (s.cur + 11) % 12; SFX.beep(pan); }
      else if (c === m.dn) { s.cur = (s.cur + 1) % 12; SFX.beep(pan); }
      else if (c === m.ok || (i === 1 && c === 'Numpad0')) selChoose(i);
      else if (c === m.inv) { s.invert = !s.invert; SFX.beep(pan); }
    });
    if (sel[0].ready && sel[1].ready) startMatch();
    return;
  }
  if (mode === 'prize') {
    if (modeT > 1.5 && (c === 'Space' || c === 'Enter' || c === 'NumpadEnter')) { goSelect(); SFX.jingle(); }
    else if (c === 'Escape') { mode = 'title'; titleT = 0; }
    return;
  }
  if (c === 'Escape') { paused = !paused; return; }
  if (paused) { if (c === 'Backspace') { paused = false; mode = 'title'; titleT = 0; } return; }
  if (mode !== 'fight' && mode !== 'victory') return;
  players.forEach((p, i) => {
    if (p.dead || (mode === 'victory' && p !== winner)) return;
    if (CTRL[i].mis.includes(c) && mode === 'fight') fireMissile(p);
    if (CTRL[i].flare.includes(c)) dropFlares(p);
  });
}
function step(dt) {
  modeT += dt;
  if (mode === 'title') { titleT += dt; return; }
  if (mode === 'select') { for (const s of sel) s.msgT -= dt; return; }
  if (paused) return;
  switch (mode) {
    case 'countdown':
      updateRocks(dt); updateFx(dt);
      if (Math.floor(modeT) !== Math.floor(modeT - dt) && modeT < 3.05) SFX.count();
      if (modeT >= 3) { mode = 'fight'; modeT = 0; SFX.go(); }
      break;
    case 'fight': case 'victory': updateGame(dt); break;
    case 'draw': updateGame(dt); if (modeT > 5) goSelect(); break;
    case 'docking': if (modeT > 2) { mode = 'prize'; modeT = 0; SFX.fanfare(); } break;
  }
}
function render() {
  fullClip();
  if (mode === 'title') drawTitle();
  else if (mode === 'select') { drawSelect(0); drawSelect(1); }
  else if (mode === 'prize') drawPrize();
  else if (mode === 'docking') {
    for (const i of [0, 1]) drawTunnel(modeT, VX[i], i === winner.id ? 'TELAKOINTI' : 'VOITTAJA TELAKOITUU');
  } else {
    for (const i of [0, 1]) { drawPlayerView(i); drawDash(i); }
    if (paused) {
      fillRect(300, 90, 200, 50, BLACK); rect(300, 90, 200, 50, YELLOW);
      textC(100, 'TAUKO', YELLOW, 2); textC(122, 'ESC JATKA  ASKELPALAUTIN LOPETA', GREY, 1, 300, 200);
    }
  }
  // keskijako
  if (mode !== 'title' && mode !== 'prize') { fillRect(VW, 0, VX[1] - VW, H, BLACK); for (let y = 0; y < H; y += 4) pset(VW + 1 + (y >> 2) % 2, y, DGREY); }
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try { step(dt); render(); } catch (err) { console.error(err); }
  present();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
